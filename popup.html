<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Media &amp; Course Downloader</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 380px;
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 12px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .header h1 {
      margin: 0;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #94a3b8;
    }
    .btn {
      padding: 5px 10px;
      border-radius: 4px;
      border: none;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: #2563eb;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn-secondary { background: #334155; color: #e2e8f0; }
    .btn-success { background: #059669; width: 100%; margin-top: 8px; padding: 7px; }
    .course-card {
      background: #13223a;
      border: 1px solid #1d4ed8;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
      display: none;
    }
    .course-label { font-size: 10px; text-transform: uppercase; color: #60a5fa; font-weight: 700; }
    .course-name { font-size: 13px; font-weight: 600; color: #f8fafc; margin-top: 2px; }
    .sub-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      color: #94a3b8;
      font-weight: 600;
    }
    .list { display: flex; flex-direction: column; gap: 7px; max-height: 360px; overflow-y: auto; }
    .item {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .item-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .item-name { font-weight: 600; color: #f1f5f9; word-break: break-all; }
    .badge {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 3px;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .badge-hls { background: #7c3aed; color: #ede9fe; }
    .badge-dash { background: #be185d; color: #fce7f3; }
    .badge-direct { background: #0284c7; color: #e0f2fe; }
    .item-url { font-size: 10px; color: #64748b; word-break: break-all; max-height: 26px; overflow: hidden; }
    .actions { display: flex; gap: 6px; margin-top: 2px; }
    .actions .btn:first-child { flex: 1; }
    .empty { padding: 20px 8px; text-align: center; color: #64748b; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Media Downloader</h1>
    <button id="open-manager" class="btn">Open Manager</button>
  </div>

  <div id="course-card" class="course-card">
    <div class="course-label">Udemy Course Detected</div>
    <div id="course-name" class="course-name">-</div>
    <button id="open-course-bulk" class="btn btn-success">Open Course Bulk Downloader</button>
  </div>

  <div class="sub-head">
    <span>Detected Streams (<span id="count">0</span>)</span>
    <button id="scan-btn" class="btn btn-secondary">Scan Page</button>
  </div>

  <div id="empty" class="empty">No streams detected yet. Play video or click Scan Page.</div>
  <div id="list" class="list"></div>

  <script src="popup.js"></script>
</body>
</html>
