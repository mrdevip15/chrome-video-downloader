<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Detected Videos</title>
  <style>
    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      background: #0f172a;
      color: #e2e8f0;
      box-sizing: border-box;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    h2 {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #count {
      background: #1e293b;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
    }
    .rescan-btn {
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 500;
      border: 1px solid #334155;
      background: #1e293b;
      color: #cbd5e1;
      border-radius: 4px;
      cursor: pointer;
    }
    .rescan-btn:hover {
      background: #334155;
      color: #fff;
    }
    #empty {
      padding: 24px 0;
      text-align: center;
      color: #64748b;
      font-size: 13px;
    }
    .media-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 420px;
      overflow-y: auto;
    }
    .media-item {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .name {
      font-size: 12px;
      font-weight: 600;
      color: #f1f5f9;
      word-break: break-all;
    }
    .badges {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .badge {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 3px;
      text-transform: uppercase;
    }
    .badge.hls {
      background: #7c3aed;
      color: #ede9fe;
    }
    .badge.direct {
      background: #0284c7;
      color: #e0f2fe;
    }
    .badge.source {
      background: #334155;
      color: #94a3b8;
    }
    .url {
      font-size: 11px;
      color: #64748b;
      word-break: break-all;
      max-height: 28px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      overflow: hidden;
      display: none;
      margin-top: 4px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: #10b981;
      transition: width 0.1s;
    }
    .status-text {
      font-size: 11px;
      color: #38bdf8;
      display: none;
    }
    .actions {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    button.action-btn {
      flex: 1;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
      transition: background 0.15s;
    }
    button.action-btn:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    button.action-btn:not(:disabled):hover {
      background: #1d4ed8;
    }
    button.copy {
      background: #334155;
      color: #cbd5e1;
      flex: 0 0 auto;
    }
    button.copy:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <header>
    <h2>
      <span>Detected Videos</span>
      <span id="count">0</span>
    </h2>
    <button class="rescan-btn" id="rescan">Scan Page Links</button>
  </header>

  <div id="empty">No videos detected yet. Play media or click "Scan Page Links".</div>
  <div class="media-list" id="list"></div>

  <script src="hls-downloader.js"></script>
  <script src="popup.js"></script>
</body>
</html>
