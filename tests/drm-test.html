<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WV L3 test</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee;
    font: 16px/1.4 system-ui, sans-serif; }
  #status { padding: 12px; }
  video { width: 100%; height: 60vh; background: #000; }
  #tap { position: fixed; inset: auto 0 0 0; height: 25vh; border: 0;
    background: #2d6cdf; color: #fff; font-size: 28px; }
</style>
</head>
<body>
<div id="status">boot…</div>
<video id="v" muted playsinline autoplay></video>
<button id="tap">TAP TO START DRM</button>
<script src="https://ajax.googleapis.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>
<script>
const statusEl = document.getElementById('status');
const video = document.getElementById('v');
const log = (m) => { statusEl.textContent = m; console.log('[wvtest] ' + m); };

async function start() {
  try {
    shaka.polyfill.installAll();
    if (!shaka.Player.isBrowserSupported()) { log('unsupported browser'); return; }
    const player = new shaka.Player();
    await player.attach(video);
    player.configure({
      drm: {
        servers: { 'com.widevine.alpha': 'https://cwip-shaka-proxy.appspot.com/no_auth' }
      }
    });
    player.addEventListener('error', (e) => log('player error: ' + (e.detail && e.detail.message)));
    await player.load('https://storage.googleapis.com/shaka-demo-assets/angel-one-widevine/dash.mpd');
    log('manifest loaded, requesting license…');
    await video.play().catch((e) => log('autoplay blocked: ' + e.message));
    log('playing — DRM session active');
  } catch (e) {
    log('error: ' + e.message);
  }
}

document.getElementById('tap').addEventListener('click', () => {
  document.getElementById('tap').style.display = 'none';
  start();
});
window.addEventListener('load', () => {
  if (typeof shaka === 'undefined') {
    log('shaka failed to load (CDN blocked?)');
    return;
  }
  start();
});
</script>
</body>
</html>
